<!doctype html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover" />
        <meta name="color-scheme" content="light dark" />
        <title>VEYDRANOX</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&display=swap" rel="stylesheet" />
        <link rel="stylesheet" href="/static/miniapp/style.css" />
        <!-- Telegram ships this script unversioned, so it cannot carry an SRI hash. -->
        <script src="https://telegram.org/js/telegram-web-app.js"></script>
        <script
            src="https://unpkg.com/lightweight-charts@4.2.3/dist/lightweight-charts.standalone.production.js"
            integrity="sha384-stKllnUqA9AD0gsKCuUtf5XlqAW7PwIgDagoNsTWkjkBmJ/GZ/uHTgEBxdLV2VSK"
            crossorigin="anonymous"
        ></script>
    </head>
    <body>
        <div id="banner" class="banner" hidden></div>

        <main id="screen"></main>

        <footer class="disclaimer-line" data-i18n="disclaimer"></footer>

        <nav class="tabs" id="tabs" hidden>
            <button data-tab="trade" data-i18n="tab.trade"></button>
            <button data-tab="rank" data-i18n="tab.rank"></button>
            <button data-tab="ai" data-i18n="tab.ai"></button>
            <button data-tab="learn" data-i18n="tab.learn"></button>
            <button data-tab="profile" data-i18n="tab.profile"></button>
        </nav>

        <dialog id="modal"></dialog>
        <div id="toast" class="toast" role="status" hidden></div>

        <script src="/static/miniapp/app.js"></script>
    </body>
</html>
