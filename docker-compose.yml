# VEYDRANOX: docker compose up -d --build   (see docs/deploy.md)
x-app: &app
  build: .
  image: veydranox
  restart: unless-stopped
  env_file: .env
  environment:
    POSTGRES_HOST: db
    POSTGRES_PORT: "5432"
    MINIAPP_URL: ${PUBLIC_URL:+${PUBLIC_URL}/miniapp}
  volumes:
    - ./artifacts:/app/artifacts
  depends_on:
    migrate:
      condition: service_completed_successfully

services:
  db:
    image: postgres:15
    container_name: trading_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-trading_db}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 20

  migrate:
    <<: *app
    restart: "no"
    command: alembic upgrade head
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *app
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"

  bot:
    <<: *app
    command: python -m app.telegram.bot

  worker:
    <<: *app
    command: python -m app.worker

  scheduler:
    <<: *app
    command: python -m app.scheduler

  backup:
    image: postgres:15
    restart: unless-stopped
    entrypoint: ["bash", "/backup.sh"]
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
      PGDATABASE: ${POSTGRES_DB:-trading_db}
    volumes:
      - ./scripts/backup.sh:/backup.sh:ro
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy

  # Local Bot API server: `docker compose --profile local-bot-api up -d telegram-bot-api`,
  # then TELEGRAM_API_URL=http://telegram-bot-api:8081 in .env (needs TELEGRAM_API_ID/HASH from my.telegram.org).
  telegram-bot-api:
    profiles: [local-bot-api]
    image: aiogram/telegram-bot-api:latest
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
    volumes:
      - telegram_bot_api_data:/var/lib/telegram-bot-api

  ngrok:
    profiles: [ngrok]
    image: ngrok/ngrok:latest
    restart: unless-stopped
    command: ["http", "api:8000", "--url=${PUBLIC_URL}"]
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    depends_on: [api]

  cloudflare:
    profiles: [cloudflare]
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on: [api]

volumes:
  postgres_data:
  telegram_bot_api_data:
